<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belot AI - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3f 100%);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
            border: 2px solid #4a7c59;
        }
        h1 {
            text-align: center;
            color: #c8e6c9;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .subtitle {
            text-align: center;
            color: #a5d6a7;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #c8e6c9;
            font-weight: 600;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #4a7c59;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: rgba(0,0,0,0.2);
            color: #c8e6c9;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #81c784;
        }
        .error {
            background: linear-gradient(135deg, #c62828 0%, #d32f2f 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #ef5350;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button:hover {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
        }
        .demo-accounts {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #4a7c59;
        }
        .demo-accounts h3 {
            font-size: 14px;
            color: #a5d6a7;
            margin-bottom: 10px;
        }
        .demo-accounts code {
            display: block;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 5px;
            margin: 5px 0;
            font-size: 13px;
            color: #c8e6c9;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>♠️ Belot AI</h1>
        <p class="subtitle">Card Game Platform</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>

        <div class="demo-accounts">
            <h3>Demo Accounts:</h3>
            <code>player1 / password123</code>
            <code>player2 / password123</code>
            <code>admin / admin123</code>
        </div>
    </div>
</body>
</html>
